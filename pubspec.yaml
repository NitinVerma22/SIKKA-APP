name: sikkaplay
description: "A premium gamified engagement app."
publish_to: 'none'

version: 1.0.9+10

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  google_fonts: ^6.1.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.12.0
  firebase_auth: ^6.5.1
  flutter_secure_storage: ^10.3.0
  http: ^1.6.0
  firebase_messaging: ^16.2.2
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  gal: ^2.3.2
  flutter_local_notifications: ^21.0.0
  google_mobile_ads: ^5.2.0
  timezone: ^0.11.0
  share_plus: ^13.1.0
  device_info_plus: ^13.1.0
  crypto: ^3.0.7
  safe_device: ^1.1.4
  firebase_crashlytics: ^5.2.2
  connectivity_plus: ^7.3.0
  audioplayers: ^6.8.1
  permission_handler: ^12.0.3
  image_picker: ^1.2.3
  flutter_image_compress: ^2.4.0
  socket_io_client: ^3.1.6
  cached_network_image: ^3.4.1
  firebase_analytics: ^12.4.4
  flame: ^1.38.0
  flutter_animate: ^4.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/spin/
    - assets/audio/water_sort/
    - assets/audio/bubble_shooter/
    - assets/audio/calling.wav
    - assets/audio/ringing.wav
    - assets/images/
    - assets/images/games_hub/
    - assets/images/bubble_shooter/
    - assets/images/profile/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
